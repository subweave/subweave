# Installed by the store-edge weave. Values come from /etc/default/telegraf.

[global_tags]
  shop = "${SHOP}"

[agent]
  interval = "10s"
  flush_interval = "10s"
  metric_buffer_limit = 1000000
  buffer_strategy = "disk"
  buffer_directory = "/var/lib/telegraf/buffer"

[[inputs.cpu]]
[[inputs.mem]]
[[inputs.disk]]
  ignore_fs = ["tmpfs", "devtmpfs", "overlay", "squashfs"]
[[inputs.net]]

[[outputs.influxdb_v2]]
  urls = ["${INFLUX_URL}"]
  token = "${INFLUX_TOKEN}"
  organization = "${INFLUX_ORG}"
  bucket = "${INFLUX_BUCKET}"
