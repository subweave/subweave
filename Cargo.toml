[package]
name = "subweave"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Keeps one service running on one Linux box, as its Weavefile says"
repository = "https://github.com/subweave/subweave"

[lib]
name = "subweave"
path = "src/lib.rs"

[[bin]]
name = "subweave"
path = "src/main.rs"

[dependencies]
anyhow = "1"
argon2 = { version = "0.5", features = ["std"] }
axum = "0.8"
base64 = "0.22"
clap = { version = "4.6", features = ["derive"] }
futures-util = { version = "0.3", default-features = false }
hex = "0.4"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
indexmap = { version = "2.14", features = ["serde"] }
jiff = "0.2"
lettre = { version = "0.11", default-features = false, features = ["builder", "hostname", "smtp-transport", "tokio1-rustls-tls"] }
libc = "0.2"
p256 = { version = "0.13", features = ["ecdsa"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
ryu = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
toml = { version = "1.1", default-features = false, features = ["std", "serde", "parse", "preserve_order"] }
tower = { version = "0.5", features = ["util"] }
uuid = { version = "1", features = ["v7"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
